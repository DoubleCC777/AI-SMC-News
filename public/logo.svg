<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="60%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>

    <!-- Neon Cyan to Emerald Gradient -->
    <linearGradient id="neonTrend" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="45%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>

    <!-- Bullish Candle 1 Gradient -->
    <linearGradient id="candleGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Bullish Candle 2 Gradient (Breakout) -->
    <linearGradient id="candleGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- AI Star Gold/Cyan Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Multi-level Glow Filters -->
    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="url(#neonTrend)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- High-Tech Corner Accents (Institutional Terminal Bracket) -->
  <path d="M 64 128 L 64 64 L 128 64" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M 448 128 L 448 64 L 384 64" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M 64 384 L 64 448 L 128 448" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M 448 384 L 448 448 L 384 448" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.4"/>

  <!-- Ambient Light Sphere Behind Chart -->
  <circle cx="280" cy="240" r="160" fill="#00f0ff" opacity="0.08" filter="blur(40px)"/>
  <circle cx="360" cy="180" r="120" fill="#10b981" opacity="0.08" filter="blur(35px)"/>

  <!-- SMC Technical Grid Marks -->
  <line x1="100" y1="256" x2="412" y2="256" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="6 8"/>
  <line x1="100" y1="170" x2="412" y2="170" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="6 8"/>
  <line x1="100" y1="342" x2="412" y2="342" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- ── 1. SMC Candlestick 1 (Accumulation / Discount Retest) ── -->
  <!-- Wick -->
  <line x1="172" y1="210" x2="172" y2="380" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <!-- Body -->
  <rect x="146" y="248" width="52" height="96" rx="10" fill="url(#candleGrad1)" filter="url(#softGlow)"/>

  <!-- ── 2. SMC Candlestick 2 (Institutional Breakout / BOS Expansion) ── -->
  <!-- Wick -->
  <line x1="276" y1="120" x2="276" y2="350" stroke="#34d399" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <!-- Body -->
  <rect x="246" y="160" width="60" height="150" rx="12" fill="url(#candleGrad2)" filter="url(#glowStrong)"/>

  <!-- ── 3. Dynamic Smart Money Surge Wave (BOS Pulse Beam) ── -->
  <path d="M 110 390 L 172 290 L 246 310 L 370 140"
        fill="none"
        stroke="url(#neonTrend)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowStrong)"/>

  <!-- Secondary Crisp Core Line for Surge Wave -->
  <path d="M 110 390 L 172 290 L 246 310 L 370 140"
        fill="none"
        stroke="#ffffff"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9"/>

  <!-- Surge Points (Nodes) -->
  <circle cx="172" cy="290" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="3" filter="url(#softGlow)"/>
  <circle cx="246" cy="310" r="8" fill="#10b981" stroke="#ffffff" stroke-width="3" filter="url(#softGlow)"/>

  <!-- ── 4. Apex AI Spark / Diamond Star (Artificial Intelligence Precision) ── -->
  <g transform="translate(370, 140)" filter="url(#glowStrong)">
    <!-- Outer Glow Rings -->
    <circle cx="0" cy="0" r="28" fill="#00f0ff" opacity="0.3"/>
    <circle cx="0" cy="0" r="16" fill="#ffffff" opacity="0.5"/>

    <!-- 4-Point AI Sparkle Star -->
    <path d="M 0 -42 Q 0 0 -42 0 Q 0 0 0 42 Q 0 0 42 0 Q 0 0 0 -42 Z" fill="url(#starGrad)"/>
    <!-- Diagonal micro star -->
    <path d="M 0 -20 Q 0 0 -20 0 Q 0 0 0 20 Q 0 0 20 0 Q 0 0 0 -20 Z" fill="#ffffff" opacity="0.9" transform="rotate(45)"/>
  </g>

  <!-- ── 5. Lower Branding Monogram: "AI·SMC" Micro-engraving ── -->
  <g transform="translate(256, 442)">
    <rect x="-82" y="-18" width="164" height="28" rx="8" fill="#000000" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
    <text text-anchor="middle" y="2" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#38bdf8" letter-spacing="3.5">
      AI·SMC
    </text>
  </g>
</svg>
